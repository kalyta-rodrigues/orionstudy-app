<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OrionStudy</title>
<script src="shared.js"></script>
<style>
:root {
  --bg: #0d0d1a;
  --surface: #13132b;
  --surface2: #1a1a38;
  --border: #2a2a55;
  --text: #e2e2f0;
  --muted: #7777aa;
  --fs: #a855f7;
  --de: #06b6d4;
  --bb: #f59e0b;
  --ok: #10b981;
  --radius: 12px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; line-height: 1.6; }

.header {
  background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 14px 24px; display: flex; align-items: center;
  justify-content: space-between; position: sticky; top: 0; z-index: 100; flex-wrap: wrap; gap: 10px;
}
.logo {
  font-size: 1.3rem; font-weight: 800; letter-spacing: -0.02em;
  background: linear-gradient(135deg, #a855f7, #ec4899, #f59e0b);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}
.header-right { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.streak {
  display: flex; align-items: center; gap: 6px;
  background: #f59e0b1a; border: 1px solid #f59e0b44;
  border-radius: 99px; padding: 4px 12px; font-size: 0.82rem; font-weight: 700; color: #fbbf24;
}
.streak svg { color: #f97316; }
.date-disp { color: var(--muted); font-size: 0.82rem; }

.quote-bar {
  background: #a855f70a; border-bottom: 1px solid #a855f720;
  padding: 9px 24px; text-align: center; font-size: 0.82rem;
  color: #c084fc; font-style: italic;
}

.nav {
  background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 0 12px; display: flex; overflow-x: auto; gap: 2px; scrollbar-width: none;
}
.nav::-webkit-scrollbar { display: none; }
.nav-btn {
  display: inline-flex; align-items: center; gap: 7px;
  background: none; border: none; color: var(--muted);
  padding: 12px 15px; cursor: pointer; font-size: 0.85rem; font-weight: 500;
  border-bottom: 2px solid transparent; white-space: nowrap; transition: all 0.2s;
}
.nav-btn:hover { color: var(--text); }
.nav-btn.active { color: #a855f7; border-bottom-color: #a855f7; }
.nav-btn.active svg { color: #a855f7; }
.nav-btn svg { flex-shrink: 0; }

.content { max-width: 1080px; margin: 0 auto; padding: 24px 20px 80px; }
.tab-panel { display: none; }
.tab-panel.active { display: block; }

.sec-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 4px; }
.sec-sub { font-size: 0.85rem; color: var(--muted); margin-bottom: 18px; }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 14px; }
.card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 14px; }

.prog-bar { height: 7px; background: var(--border); border-radius: 99px; overflow: hidden; }
.prog-fill { height: 100%; border-radius: 99px; transition: width 0.6s cubic-bezier(.4,0,.2,1); }

.badge {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 11px; border-radius: 99px; font-size: 0.75rem; font-weight: 700; margin-bottom: 10px;
}
.badge svg { flex-shrink: 0; }
.badge-fs { background: #a855f71a; color: #c084fc; border: 1px solid #a855f740; }
.badge-de { background: #06b6d41a; color: #22d3ee; border: 1px solid #06b6d440; }
.badge-bb { background: #f59e0b1a; color: #fbbf24; border: 1px solid #f59e0b40; }
.badge-sk { background: #10b9811a; color: #34d399; border: 1px solid #10b98140; }

.task-list { list-style: none; }
.task-item {
  display: flex; align-items: flex-start; gap: 11px;
  padding: 9px 10px; border-radius: 8px; cursor: pointer; transition: background 0.15s; user-select: none;
}
.task-item:hover { background: var(--surface2); }
.task-item.done .task-text { text-decoration: line-through; color: var(--muted); }
.chk {
  width: 19px; height: 19px; border: 2px solid var(--border); border-radius: 5px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; margin-top: 2px; transition: all 0.2s;
}
.task-item.done .chk { background: var(--ok); border-color: var(--ok); }
.chk-icon { display: none; color: white; }
.task-item.done .chk-icon { display: flex; }
.task-text { font-size: 0.875rem; line-height: 1.5; }

.phase-wrap { margin-bottom: 10px; }
.phase-head {
  padding: 14px 18px; display: flex; justify-content: space-between; align-items: center;
  cursor: pointer; border-radius: 12px 12px 0 0;
}
.phase-head:hover { filter: brightness(1.08); }
.phase-title-text { font-size: 0.92rem; font-weight: 700; }
.phase-meta { font-size: 0.78rem; opacity: 0.75; display: flex; align-items: center; gap: 10px; }
.phase-body { border: 1px solid var(--border); border-top: none; border-radius: 0 0 var(--radius) var(--radius); }
.phase-body.collapsed { display: none; }

.focus-card { border-radius: var(--radius); padding: 26px 28px; margin-bottom: 18px; }
.focus-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 2px; opacity: 0.6; margin-bottom: 6px; }
.focus-area { font-size: 1.8rem; font-weight: 800; margin-bottom: 4px; display: flex; align-items: center; gap: 12px; }
.focus-time { font-size: 0.85rem; opacity: 0.75; margin-bottom: 6px; }
.focus-tip { font-size: 0.85rem; opacity: 0.65; font-style: italic; }

.overview-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-bottom: 20px; }
@media (max-width: 580px) { .overview-grid { grid-template-columns: 1fr; } }
.ov-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
.ov-name { font-size: 0.78rem; font-weight: 700; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
.ov-pct { font-size: 1.6rem; font-weight: 800; margin-bottom: 8px; }
.ov-count { font-size: 0.75rem; color: var(--muted); margin-top: 6px; }

.week-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; margin-bottom: 24px; }
@media (max-width: 700px) { .week-grid { grid-template-columns: repeat(2, 1fr); } }
.day-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; }
.day-card.today { border-width: 1.5px; }
.day-name { font-size: 0.68rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 8px; }
.day-area-dot { width: 6px; height: 6px; border-radius: 99px; display: inline-block; margin-right: 5px; }
.day-area-label { font-size: 0.72rem; font-weight: 700; margin-bottom: 8px; display: flex; align-items: center; }
.day-tasks { font-size: 0.71rem; color: var(--muted); list-style: none; }
.day-tasks li { padding: 2px 0; line-height: 1.4; }
.day-tasks li::before { content: '—'; margin-right: 5px; opacity: 0.4; }

.proj-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; transition: border-color 0.2s; }
.proj-card:hover { border-color: #4444aa; }
.proj-level { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; font-weight: 600; margin-bottom: 5px; }
.proj-title { font-size: 1rem; font-weight: 700; margin-bottom: 8px; }
.proj-desc { font-size: 0.83rem; color: var(--muted); margin-bottom: 14px; line-height: 1.6; }
.proj-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 14px; }
.tag { display: inline-block; padding: 2px 9px; border-radius: 99px; font-size: 0.7rem; font-weight: 600; background: var(--surface2); color: var(--muted); }
.status-btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 14px; border-radius: 99px; border: none;
  cursor: pointer; font-size: 0.78rem; font-weight: 700; transition: all 0.2s;
}
.s-pending { background: var(--surface2); color: var(--muted); }
.s-progress { background: #06b6d41a; color: #22d3ee; }
.s-done { background: #10b9811a; color: #34d399; }

.emer-btn {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  background: linear-gradient(135deg, #ef4444, #f59e0b);
  border: none; color: white; padding: 13px 28px; border-radius: 10px;
  font-size: 0.9rem; font-weight: 700; cursor: pointer; width: 100%; margin-bottom: 18px; transition: opacity 0.2s;
}
.emer-btn:hover { opacity: 0.88; }
.emer-panel { display: none; }
.emer-panel.visible { display: block; }

.pomo-card {
  background: #a855f70a; border: 1px solid #a855f728;
  border-radius: var(--radius); padding: 20px; margin-bottom: 14px;
}
.pomo-title { font-size: 0.92rem; font-weight: 700; color: #c084fc; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
.pomo-row { display: flex; align-items: center; gap: 10px; padding: 6px 0; font-size: 0.875rem; }
.pomo-dot { width: 8px; height: 8px; border-radius: 99px; background: #a855f7; flex-shrink: 0; }
.pomo-dot.rest { background: var(--muted); }

.divider-title {
  display: flex; align-items: center; gap: 12px; margin: 22px 0 14px;
  font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; color: var(--muted);
}
.divider-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }

.rule-item {
  display: flex; gap: 10px; align-items: flex-start;
  padding: 10px 14px; background: var(--surface2); border-radius: 8px; margin-bottom: 7px; font-size: 0.875rem;
}
.rule-icon { flex-shrink: 0; margin-top: 2px; }

.highlight-card {
  border-left: 3px solid; border-radius: 0 var(--radius) var(--radius) 0;
  padding: 14px 16px; margin-bottom: 14px; background: var(--surface2); font-size: 0.875rem; line-height: 1.7;
}

.rest-card {
  border-radius: var(--radius); padding: 40px 32px; text-align: center;
  background: var(--surface); border: 1px solid var(--border); margin-bottom: 18px;
}
.rest-title { font-size: 1.6rem; font-weight: 800; color: var(--muted); margin-bottom: 8px; }
.rest-sub { font-size: 0.9rem; color: var(--muted); max-width: 480px; margin: 0 auto; line-height: 1.8; }

.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  background: var(--ok); color: white; padding: 10px 22px; border-radius: 99px;
  font-size: 0.83rem; font-weight: 600; z-index: 9998; opacity: 0;
  transition: opacity 0.3s; pointer-events: none; white-space: nowrap;
}
.toast.show { opacity: 1; }

#confetti { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9999; display: none; }

::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

.situation-row { display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 0.875rem; align-items: flex-start; }
.situation-row:last-child { border-bottom: none; }
.situation-dot { width: 10px; height: 10px; border-radius: 99px; flex-shrink: 0; margin-top: 5px; }

/* ═══════════ MODO CLARO — ativado por data-theme="light" no <html> ═══════════ */
:root[data-theme="light"] {
  --bg: #f4f4fa;
  --surface: #ffffff;
  --surface2: #ededf5;
  --border: #dadae8;
  --text: #1c1c30;
  --muted: #5f5f7c;
  --fs: #7c3aed;
  --de: #0e7490;
  --bb: #b45309;
  --ok: #047857;
}
:root[data-theme="light"] body { background: var(--bg); color: var(--text); }
/* acentos que no JS vêm com cor clara fixa (ok no escuro, fracos no claro) */
:root[data-theme="light"] .quote-bar { color: #6d28d9; }
:root[data-theme="light"] .streak { color: #b45309; }
:root[data-theme="light"] .badge-fs { color: #6d28d9; }
:root[data-theme="light"] .badge-de { color: #0e7490; }
:root[data-theme="light"] .badge-bb { color: #b45309; }
:root[data-theme="light"] .badge-sk { color: #047857; }
:root[data-theme="light"] .nav-btn.active,
:root[data-theme="light"] .nav-btn.active svg { color: #7c3aed; border-bottom-color: #7c3aed; }
/* títulos que recebem cor via style inline no JS: prioriza legibilidade */
:root[data-theme="light"] .ov-name,
:root[data-theme="light"] .ov-pct,
:root[data-theme="light"] .focus-area,
:root[data-theme="light"] .focus-label,
:root[data-theme="light"] .phase-title-text,
:root[data-theme="light"] .day-area-label { color: #26263f !important; }

/* ── INTENSIDADE DAS TRILHAS (itens 1 e 5) ── */
.intens-badge {
  display: inline-block; padding: 2px 8px; border-radius: 99px;
  font-size: 0.62rem; font-weight: 700; letter-spacing: .03em; vertical-align: middle; margin-left: 8px;
  background: var(--surface2); color: var(--muted); border: 1px solid var(--border);
}
.intens-moderada { opacity: .75; }
.intens-pausada { opacity: .5; }
.nav-btn.intens-moderada, .nav-btn.intens-pausada { opacity: .55; }
.intens-select {
  background: var(--surface2); border: 1px solid var(--border); color: var(--text);
  border-radius: 6px; padding: 3px 7px; font-size: .72rem; cursor: pointer;
}

/* ── BADGE "+ Sankhya" NOS TÓPICOS (item 3) ── */
.tag-sk {
  display: inline-block; margin-left: 8px; padding: 1px 7px; border-radius: 99px;
  font-size: .62rem; font-weight: 700; white-space: nowrap; vertical-align: middle;
  background: #10b9811a; color: #34d399; border: 1px solid #10b98140;
}

/* ── BARRA / BANNER DE REAVALIAÇÃO (item 7) ── */
.reaval-bar {
  max-width: 1080px; margin: 0 auto; padding: 12px 20px 0;
  display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between;
}
.reaval-edit { font-size: .78rem; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.reaval-edit input {
  background: var(--surface2); border: 1px solid var(--border); color: var(--text);
  border-radius: 6px; padding: 4px 8px; font-size: .78rem;
}
.reaval-banner {
  width: 100%; background: #f59e0b14; border: 1px solid #f59e0b44; color: #fbbf24;
  border-radius: 10px; padding: 10px 14px; font-size: .83rem; font-weight: 600;
}
</style>
</head>
<body>

<canvas id="confetti"></canvas>
<div class="toast" id="toast"></div>

<header class="header">
  <div class="logo">OrionStudy</div>
  <div class="header-right">
    <span class="streak" id="streak-el">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>
      <span id="streak-count">0 dias</span>
    </span>
    <span class="date-disp" id="date-el"></span>
  </div>
</header>
<div class="quote-bar" id="quote-el"></div>

<nav class="nav">
  <button class="nav-btn active" data-tab="hoje">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></svg>
    Hoje
  </button>
  <button class="nav-btn" data-tab="semana">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/><path d="M8 14h.01"/><path d="M12 14h.01"/><path d="M16 14h.01"/><path d="M8 18h.01"/><path d="M12 18h.01"/><path d="M16 18h.01"/></svg>
    Semana
  </button>
  <button class="nav-btn" data-tab="fullstack">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 16 4-4-4-4"/><path d="m6 8-4 4 4 4"/><path d="m14.5 4-5 16"/></svg>
    Fullstack
  </button>
  <button class="nav-btn" data-tab="dados">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5V19A9 3 0 0 0 21 19V5"/><path d="M3 12A9 3 0 0 0 21 12"/></svg>
    Dados
  </button>
  <button class="nav-btn" data-tab="bb">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" x2="21" y1="22" y2="22"/><line x1="6" x2="6" y1="18" y2="22"/><line x1="10" x2="10" y1="18" y2="22"/><line x1="14" x2="14" y1="18" y2="22"/><line x1="18" x2="18" y1="18" y2="22"/><polygon points="12 2 20 7 4 7"/></svg>
    BB
  </button>
  <!-- SANKHYA COMO TRILHA — desativado até a universidade Sankhya liberar os cursos oficiais da DIO (SQL + Java).
       Para reativar: descomente este botão + o <div id="tab-sankhya"> em <main> + troque SANKHYA_TRILHA_ATIVA para true.
  <button class="nav-btn" data-tab="sankhya">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="6" rx="1"/><rect x="2" y="15" width="20" height="6" rx="1"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/></svg>
    Sankhya
  </button>
  -->
  <button class="nav-btn" data-tab="projetos">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/><path d="m22 12.65-8.6 3.91a2 2 0 0 1-1.8 0L3 12.65"/><path d="m22 17.65-8.6 3.91a2 2 0 0 1-1.8 0L3 17.65"/></svg>
    Projetos
  </button>
  <button class="nav-btn" data-tab="motivacao">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/></svg>
    Anti-Desistência
  </button>
  <a class="nav-btn" href="biblioteca.html" style="text-decoration:none">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>
    Biblioteca
  </a>
  <a class="nav-btn" href="cronograma.html" style="text-decoration:none">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/><path d="M8 14h.01"/><path d="M12 14h.01"/><path d="M16 14h.01"/></svg>
    Gran Cursos
  </a>
</nav>

<div id="reaval-bar" class="reaval-bar">
  <div id="reaval-banner" class="reaval-banner" style="display:none"></div>
  <label class="reaval-edit">
    Próxima reavaliação do plano:
    <input type="date" id="reaval-date">
  </label>
</div>

<main class="content">
  <div id="tab-hoje" class="tab-panel active"></div>
  <div id="tab-semana" class="tab-panel"></div>
  <div id="tab-fullstack" class="tab-panel"></div>
  <div id="tab-dados" class="tab-panel"></div>
  <div id="tab-bb" class="tab-panel"></div>
  <!-- <div id="tab-sankhya" class="tab-panel"></div> -->
  <div id="tab-projetos" class="tab-panel"></div>
  <div id="tab-motivacao" class="tab-panel"></div>
</main>

<script>
/* ── ICONS ── */

/* ══════════════════════════════════════════════════════════════════════
   SANKHYA — CONTROLE DE ATIVAÇÃO
   Enquanto a universidade Sankhya não liberar os cursos oficiais da DIO
   (SQL + Java), Sankhya NÃO é trilha com bloco de tempo próprio: é uma
   camada marcada pela tag "Sankhya" nos tópicos de Fullstack e Dados
   (ver taskTags / badge "+ Sankhya").

   PARA REATIVAR Sankhya como trilha própria quando a universidade abrir:
     1) troque SANKHYA_TRILHA_ATIVA para true
     2) descomente o <button data-tab="sankhya"> na <nav>
     3) descomente o <div id="tab-sankhya"> em <main>
   Todo o resto (const SK, aba, cards em Hoje/Semana) volta sozinho pelo flag.
   ══════════════════════════════════════════════════════════════════════ */
const SANKHYA_TRILHA_ATIVA = false;

/* Intensidade inicial por trilha: 'alta' | 'moderada' | 'pausada' (item 2) */
const INTENS_PADRAO = { fs:'alta', de:'pausada', bb:'alta' /*, sk:'alta' */ };
const INTENS_INFO = {
  alta:     { ord:0, cls:'',                badge:'' },
  moderada: { ord:1, cls:'intens-moderada', badge:'Ritmo reduzido' },
  pausada:  { ord:2, cls:'intens-pausada',  badge:'Pausada' },
};
function trilhaIntens(key){
  return (S.intensidade && S.intensidade[key]) || INTENS_PADRAO[key] || 'alta';
}
function setTrilhaIntens(key, val){
  S.intensidade = S.intensidade || {};
  S.intensidade[key] = val;
  saveState();
  rerenderAll();
}
function tabKey(tab){ return tab==='fullstack' ? 'fs' : tab==='dados' ? 'de' : tab; }

/* Nota exibida na aba Sankhya quando ela estiver ativa */
const SK_NOTE = `<strong style="color:#34d399">4h/semana, dentro do expediente</strong> — paralelo à rotina pessoal (Fullstack/Dados/BB), não compete com ela.<br><br>
<strong style="color:#34d399">Antes de repetir:</strong> SQL básico (SELECT, JOIN, GROUP BY, DDL — Semanas 1, 2 e 4) já está coberto em <strong>Dados → Fase 1</strong> e em <strong>BB → TI-Banco de Dados</strong>. Modelagem/normalização (Semanas 3 e 5) também tem sobreposição com <strong>BB → TI-Banco de Dados</strong>. Se já marcou aqueles tópicos como concluídos, pode acelerar essas semanas — revise em vez de assistir do zero. Java (Semanas 6-12) é conteúdo novo, sem trilha equivalente no site.`;

/* ── STATE ── */
let S = {tasks:{}, projects:{}, streak:0, lastStudyDate:null,
         intensidade:{}, tags:{}, proximaReavaliacao:null};

function loadState() {
  let saved = {};
  try { const s = localStorage.getItem('orion_v4'); if(s) saved = JSON.parse(s) || {}; } catch(e){}
  // merge sobre os defaults — tolera backups antigos/parciais sem quebrar (item 6)
  S = Object.assign({ tasks:{}, projects:{}, streak:0, lastStudyDate:null,
                      intensidade:{}, tags:{}, proximaReavaliacao:null }, saved);
  S.tasks = S.tasks || {};
  S.projects = S.projects || {};
  S.intensidade = Object.assign({}, INTENS_PADRAO, S.intensidade || {});
  S.tags = S.tags || {};
}
function saveState() { try { localStorage.setItem('orion_v4', JSON.stringify(S)); } catch(e){} }
function isDone(id) { return !!S.tasks[id]; }
function projStatus(id) { return S.projects[id] || 'pending'; }
function progress(tasks) {
  const done = tasks.filter(t=>isDone(t.id)).length;
  return { done, total:tasks.length, pct: tasks.length ? Math.round(done/tasks.length*100) : 0 };
}
function allTasks(area) {
  if(area==='fs') return FS.phases.flatMap(p=>p.tasks);
  if(area==='de') return DE.phases.flatMap(p=>p.tasks);
  if(area==='bb') return BB.groups.flatMap(g=>g.tasks);
  if(area==='sk') return SK.phases.flatMap(p=>p.tasks);
  return [];
}

/* ── STREAK ── */
function updateStreak() {
  const today = new Date().toDateString();
  if(S.lastStudyDate===today) return;
  const yesterday = new Date(Date.now()-86400000).toDateString();
  S.streak = (S.lastStudyDate===yesterday) ? (S.streak||0)+1 : 1;
  S.lastStudyDate = today;
  saveState();
  renderStreak();
}
function renderStreak() {
  const n = S.streak||0;
  document.getElementById('streak-count').textContent = `${n} dia${n!==1?'s':''}`;
}

/* ── TOGGLE ── */
function toggleTask(id, el) {
  S.tasks[id] = !S.tasks[id];
  saveState(); updateStreak();
  el.classList.toggle('done', !!S.tasks[id]);
  if(S.tasks[id]) showToast('Concluído.');
  refreshProgress();
}
function cycleProject(id, btn) {
  const c = {pending:'progress',progress:'done',done:'pending'};
  S.projects[id] = c[projStatus(id)];
  saveState();
  const m = {
    pending: [IC.clock+' Pendente','s-pending'],
    progress:[IC.play+' Em andamento','s-progress'],
    done:    [IC.done+' Concluído','s-done'],
  };
  const [txt,cls] = m[S.projects[id]];
  btn.innerHTML = txt; btn.className = 'status-btn '+cls;
}

/* ── PROGRESS REFRESH ── */
function refreshProgress() {
  document.querySelectorAll('[data-prog]').forEach(el => {
    const id = el.dataset.prog;
    let tasks;
    if(['fs','de','bb','sk'].includes(id)) tasks = allTasks(id);
    else {
      const ph = [...FS.phases,...DE.phases,...SK.phases].find(p=>p.id===id) || BB.groups.find(g=>g.id===id);
      tasks = ph ? ph.tasks : [];
    }
    const {done,total,pct} = progress(tasks);
    el.style.width = pct+'%';
    const lbl = document.querySelector(`[data-prog-lbl="${id}"]`);
    if(lbl) lbl.textContent = `${pct}% (${done}/${total})`;
    const pEl = document.querySelector(`[data-prog-pct="${id}"]`);
    if(pEl) pEl.textContent = pct+'%';
    const cEl = document.querySelector(`[data-prog-count="${id}"]`);
    if(cEl) cEl.textContent = `${done}/${total} tópicos`;
  });
}

/* Une as tags estáticas do tópico com overrides salvos no localStorage (item 6) */
function taskTags(t) {
  const extra = (S.tags && S.tags[t.id]) || [];
  return [...new Set([...(t.tags || []), ...extra])];
}

/* ── TASK HTML ── */
function taskHTML(t) {
  const skBadge = taskTags(t).includes('Sankhya')

    <span class="chk"><span class="chk-icon">${IC.check}</span></span>
    <span class="task-text">${t.t}${skBadge}</span>

}

/* ── TOAST ── */
let toastTimer;
function showToast(msg) {
  const el = document.getElementById('toast');

  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('show'), 2000);

/* ── CONFETTI ── */
function confetti() {
  const cv = document.getElementById('confetti');
  cv.style.display='block'; cv.width=window.innerWidth; cv.height=window.innerHeight;
  const ctx=cv.getContext('2d');
  const cols=['#a855f7','#ec4899','#06b6d4','#f59e0b','#10b981'];
  const ps=Array.from({length:100},()=>({
    x:Math.random()*cv.width,y:-10,vx:(Math.random()-.5)*7,vy:Math.random()*3+2,
    c:cols[~~(Math.random()*cols.length)],w:Math.random()*10+5,h:Math.random()*5+3,
    r:Math.random()*360,rs:(Math.random()-.5)*12
  }));
  let f=0;
  (function a(){
    ctx.clearRect(0,0,cv.width,cv.height);
    ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.08;p.r+=p.rs;
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r*Math.PI/180);
      ctx.fillStyle=p.c;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore();});
    if(++f<160) requestAnimationFrame(a); else cv.style.display='none';
  })();
}

/* ── ROTINA SEMANAL RESPEITA INTENSIDADE (item 5) ──
   Enquanto uma trilha estiver "pausada", os dias dela na rotina semanal
   são redirecionados para uma trilha de intensidade "alta" (Fullstack/BB),
   alternando entre elas. Volta ao normal sozinho quando a trilha sai de
   "pausada" (nada persistido: é recalculado a cada render). */
function areaKeyOf(area){
  if(area.includes('Dados')) return 'de';
  if(area.includes('Banco') || area === 'BB') return 'bb';
  if(area === 'Descanso') return null;
  return 'fs';
}
const AREA_META = {
  fs: { area:'Fullstack',       color:'#a855f7' },
  de: { area:'Eng. de Dados',   color:'#06b6d4' },
  bb: { area:'Banco do Brasil', color:'#f59e0b' },
};
function effectiveWeek(){
  const alvos = ['fs','bb'].filter(k => trilhaIntens(k) === 'alta');
  const pool = alvos.length ? alvos : ['fs']; // fallback defensivo
  let i = 0;
  return WEEK.map(d => {
    const key = areaKeyOf(d.area);
    if(!key || trilhaIntens(key) !== 'pausada') return d;
    const alvo = pool[i++ % pool.length];
    const m = AREA_META[alvo];
    return {
      ...d,
      area: m.area,
      color: m.color,
      redirected: true,
      redirectedFrom: d.area,
      tasks: [
        `${d.area} está pausada — foco do dia redirecionado para ${m.area}`,
        `Avance 1 tópico novo de ${m.area}`,
        'Marque o que concluir',
      ],
    };
  });
}

/* ── INTENSIDADE VISUAL NAS ABAS + "pausada" vai pro fim (item 5) ── */
function applyIntensToNav(){
  const order = ['fullstack','dados','bb'];
  const btns = order.map(t=>document.querySelector(`.nav-btn[data-tab="${t}"]`)).filter(Boolean);
  if(!btns.length) return;
  const nav = btns[0].parentNode;
  const after = btns[btns.length-1].nextSibling; // nó logo após as trilhas (ex: aba Projetos)
  btns.sort((a,b)=>
    INTENS_INFO[trilhaIntens(tabKey(a.dataset.tab))].ord -
    INTENS_INFO[trilhaIntens(tabKey(b.dataset.tab))].ord);
  btns.forEach(btn=>{
    const info = INTENS_INFO[trilhaIntens(tabKey(btn.dataset.tab))];
    btn.classList.remove('intens-moderada','intens-pausada');
    btn.querySelector('.intens-badge')?.remove();
    if(info.cls) btn.classList.add(info.cls);
    if(info.badge){
      btn.title = info.badge;
      btn.insertAdjacentHTML('beforeend', `<span class="intens-badge">${info.badge}</span>`);
    } else {
      btn.removeAttribute('title');
    }
    nav.insertBefore(btn, after);
  });
}

      <div class="focus-area" style="color:${sc.color}">${areaIcon} ${sc.area}</div>
      <div class="focus-time">Meta: ${sc.time} de estudo</div>
      ${sc.redirected ? `<div class="focus-tip">↪ ${sc.redirectedFrom} está pausada — foco do dia redirecionado.</div>` : ''}
      <div class="focus-tip">${getDayTip(dow)}</div>
    </div>
    ${overview}
    <div class="card">
      <div class="sec-title">Próximas tarefas</div>
      <div class="sec-sub">Foco em <strong>${sc.area}</strong>. Marque o que concluir. Não precisa fazer tudo hoje.</div>
      <ul class="task-list">${taskItems}</ul>
    </div>
    ${SANKHYA_TRILHA_ATIVA ? skCard : ''}
    <div class="card" style="background:#a855f708;border-color:#a855f720">
      <div class="sec-title" style="display:flex;align-items:center;gap:8px">${IC.timer} Pomodoro</div>
      <div style="font-size:0.875rem;margin-top:8px;line-height:1.8">
        <strong>25 min</strong> de estudo — <strong>5 min</strong> de pausa — repita 3 ou 4 vezes — <strong>20 min</strong> de pausa longa.<br>
        <span style="color:var(--muted)">Isso são ~2h de estudo real. Não precisa de mais que isso por dia.</span>
      </div>
    </div>`;
}

function getDayTip(dow) {
  return [
    "",
    "Começa com código. Abre o editor antes de qualquer outra coisa.",
    "Dia de questões. Resolve provas reais — não só lê teoria.",
    "Você chegou até quarta. Só mais um dia de esforço.",
    "Pratica o que aprendeu na semana. Código na tela.",
    "Dia de simulado. Cronometre-se. Prova tem tempo limitado.",
    "Dia de projeto. Nada motiva mais do que ver o código rodando.",
  ][dow];
}

/* ── RENDER SEMANA ── */
function renderSemana() {
  const today = new Date().getDay();
  const areaIcon = a => a.includes('Dados')?IC.db : a.includes('Banco')||a==='BB'?IC.bank : a==='Descanso'?IC.moon : IC.code;

  const weekHTML = effectiveWeek().map((d,i)=>`
    <div class="day-card${i===today?' today':''}${d.redirected?' intens-moderada':''}"${i===today?` style="border-color:${d.color}"`:''}>
      <div class="day-name">${d.day.slice(0,3).toUpperCase()}</div>
      <div class="day-area-label" style="color:${d.color}">
        <span class="day-area-dot" style="background:${d.color}"></span>${d.area}
      </div>
      ${d.redirected ? `<div style="font-size:0.58rem;color:#7777aa;margin-bottom:4px">↪ ${d.redirectedFrom} pausada</div>` : ''}
      <div style="font-size:0.7rem;color:var(--muted);margin-bottom:6px">${d.time}</div>
      <ul class="day-tasks">${d.tasks.map(t=>`<li>${t}</li>`).join('')}</ul>
    </div>`).join('');

  const TR = [
    { key:'fs', badge:'badge-fs', ico:IC.code,   label:'Fullstack', h:'~3h por semana',   txt:'Segunda e quinta. Foco em código prático. Commite no GitHub toda semana.' },
    { key:'de', badge:'badge-de', ico:IC.db,     label:'Dados',     h:'~3,5h por semana', txt:'Quarta e sábado. Python e SQL precisam de prática constante. Escreva código.' },
    { key:'bb', badge:'badge-bb', ico:IC.bank,   label:'BB',        h:'~3h por semana',   txt:'Terça e sexta. Alterne teoria e questões. Nunca só leia — resolve questões.' },
  ];
  if (SANKHYA_TRILHA_ATIVA) TR.push(
    { key:'sk', badge:'badge-sk', ico:IC.server, label:'Sankhya',   h:'4h por semana — expediente', txt:'Segunda a sexta, nos horários livres do trabalho. Paralelo à rotina acima, não substitui nenhum dia dela.' });

  const trilhaCards = TR.slice()
    .sort((a,b)=> INTENS_INFO[trilhaIntens(a.key)].ord - INTENS_INFO[trilhaIntens(b.key)].ord)
    .map(t=>{
      const it = INTENS_INFO[trilhaIntens(t.key)];
      const b = it.badge ? `<span class="intens-badge">${it.badge}</span>` : '';
      return `<div class="card ${it.cls}">
        <div class="badge ${t.badge}">${t.ico} ${t.label}</div>${b}
        <div class="sec-title">${t.h}</div>
        <div style="font-size:0.85rem;color:var(--muted);margin-top:6px">${t.txt}</div>
      </div>`;
    }).join('');

  const metas = [
    {id:'w-fs', t:'Marcar ao menos 3 novos tópicos de Fullstack'},
    {id:'w-de', t:'Marcar ao menos 3 novos tópicos de Dados'},
    {id:'w-bb', t:'Resolver ao menos 20 questões de BB'},
    ...(SANKHYA_TRILHA_ATIVA ? [{id:'w-sk', t:'Completar ao menos 1 semana do Sankhya (SQL/Java)'}] : []),
    {id:'w-git',t:'Fazer ao menos 1 commit no GitHub'},
    {id:'w-str',t:'Estudar pelo menos 5 dias esta semana'},
  ];

  document.getElementById('tab-semana').innerHTML = `
    <div class="sec-title">Rotina semanal</div>
    <div class="sec-sub">Cada área recebe atenção toda semana. Hoje está destacado.</div>
    <div class="week-grid">${weekHTML}</div>
    <div class="card-grid">${trilhaCards}</div>
    <div class="card" style="margin-top:4px">
      <div class="sec-title">Metas da semana</div>
      <div class="sec-sub">Indicadores de consistência. Marque o que conseguir.</div>
      <ul class="task-list">
        ${metas.map(t=>taskHTML(t)).join('')}
      </ul>
    </div>`;
}

/* ── RENDER AREA ── */
function renderArea(el, data, key, note) {
  const tot = progress(data.phases.flatMap(p=>p.tasks));
  const ico = key==='fs' ? IC.code : key==='sk' ? IC.server : IC.db;
  const ph = data.phases.map(ph=>{
    const p = progress(ph.tasks);
    return `
      <div class="phase-wrap">
        <div class="phase-head" style="background:${ph.color}12;border:1px solid ${ph.color}38" onclick="togglePhase('${ph.id}')">
          <div>
            <div class="phase-title-text" style="color:${ph.color}">${ph.name}</div>
            <div class="phase-meta">${ph.weeks}</div>
          </div>
          <div class="phase-meta" style="flex-direction:column;align-items:flex-end;gap:5px">
            <span data-prog-lbl="${ph.id}">${p.pct}% (${p.done}/${p.total})</span>
            <div class="prog-bar" style="width:88px"><div class="prog-fill" data-prog="${ph.id}" style="width:${p.pct}%;background:${ph.color}"></div></div>
          </div>
        </div>
        <div class="phase-body" id="phase-${ph.id}">
          <ul class="task-list">${ph.tasks.map(t=>taskHTML(t)).join('')}</ul>
        </div>
      </div>`;
  }).join('');

  const it = INTENS_INFO[trilhaIntens(key)];
  const intensBadge = it.badge ? `<span class="intens-badge">${it.badge}</span>` : '';
  const intensSelect = `
    <select class="intens-select" style="margin-left:auto" onchange="setTrilhaIntens('${key}', this.value)">
      ${['alta','moderada','pausada'].map(v=>
        `<option value="${v}" ${trilhaIntens(key)===v?'selected':''}>Intensidade: ${v}</option>`).join('')}
    </select>`;

  el.innerHTML = `
    <div class="${it.cls}">
    <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
      <span class="badge badge-${key}" style="margin:0">${ico} ${data.label}</span>
      ${intensBadge}
      ${intensSelect}
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin:14px 0 6px">
      <div class="sec-title">Progresso total</div>
      <span style="font-size:1.1rem;font-weight:800;color:${data.color}">${tot.pct}%</span>
    </div>
    <div class="prog-bar" style="height:9px;margin-bottom:22px">
      <div class="prog-fill" data-prog="${key}" style="width:${tot.pct}%;background:${data.grad}"></div>
    </div>
    ${note ? `<div class="highlight-card" style="border-color:${data.color};margin-bottom:18px">${note}</div>` : ''}
    ${sankhyaHint(key)}
    ${ph}
    </div>`;
}

/* ── RENDER BB ── */
function renderBB() {
  const tot = progress(allTasks('bb'));
  const groups = BB.groups.map(g=>{
    const p = progress(g.tasks);
    const c = g.high ? '#f59e0b' : '#fb923c';
    return `
      <div class="phase-wrap">
        <div class="phase-head" style="background:${c}12;border:1px solid ${c}38" onclick="togglePhase('${g.id}')">
          <div><div class="phase-title-text" style="color:${c}">${g.name}</div></div>
          <div class="phase-meta" style="flex-direction:column;align-items:flex-end;gap:5px">
            <span data-prog-lbl="${g.id}">${p.pct}% (${p.done}/${p.total})</span>
            <div class="prog-bar" style="width:80px"><div class="prog-fill" data-prog="${g.id}" style="width:${p.pct}%;background:${c}"></div></div>
          </div>
        </div>
        <div class="phase-body" id="phase-${g.id}">
          <ul class="task-list">${g.tasks.map(t=>taskHTML(t)).join('')}</ul>
        </div>
      </div>`;
  }).join('');

  const bbIt = INTENS_INFO[trilhaIntens('bb')];

  document.getElementById('tab-bb').innerHTML = `
    <div class="${bbIt.cls}">
    <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
      <span class="badge badge-bb" style="margin:0">${IC.bank} ${BB.label}</span>
      ${bbIt.badge ? `<span class="intens-badge">${bbIt.badge}</span>` : ''}
      <select class="intens-select" style="margin-left:auto" onchange="setTrilhaIntens('bb', this.value)">
        ${['alta','moderada','pausada'].map(v=>`<option value="${v}" ${trilhaIntens('bb')===v?'selected':''}>Intensidade: ${v}</option>`).join('')}
      </select>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin:14px 0 6px">
      <div class="sec-title">Progresso total</div>
      <span style="font-size:1.1rem;font-weight:800;color:#fbbf24">${tot.pct}%</span>
    </div>
    <div class="prog-bar" style="height:9px;margin-bottom:10px">
      <div class="prog-fill" data-prog="bb" style="width:${tot.pct}%;background:linear-gradient(90deg,#f59e0b,#f97316)"></div>
    </div>
    <div class="sec-sub">Matérias marcadas como "alto peso" são as mais cobradas no cargo de Agente de Tecnologia.</div>
    <div class="highlight-card" style="border-color:#f59e0b;margin-bottom:18px">
      <strong style="color:#fbbf24">Estratégia:</strong> TI tem peso alto — BD, Redes, Segurança, Cloud, Dev. Estude essas com prioridade.
      Português e Matemática são eliminatórios. Resolva muitas questões de provas anteriores do BB.
    </div>
    ${groups}
    </div>`;
}

/* ── RENDER PROJETOS ── */
function renderProjetos() {
  const areaLabels = {fs:'Projetos Fullstack', de:'Projetos Engenharia de Dados', bb:'Projetos Banco do Brasil'};
  const areaIcons = {fs:IC.code, de:IC.db, bb:IC.bank};
  const areaBadge = {fs:'badge-fs', de:'badge-de', bb:'badge-bb'};
  let html = '';
  ['fs','de','bb'].forEach(area=>{
    const cards = PROJECTS.filter(p=>p.area===area).map(p=>{
      const st = projStatus(p.id);
      const m = {
        pending: [IC.clock+' Pendente','s-pending'],
        progress:[IC.play+' Em andamento','s-progress'],
        done:    [IC.done+' Concluído','s-done'],
      };
      const [lbl,cls] = m[st];
      return `<div class="proj-card">
        <div class="proj-level">${p.level}</div>
        <div class="proj-title">${p.title}</div>
        <div class="proj-desc">${p.desc}</div>
        <div class="proj-tags">${p.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
        <button class="status-btn ${cls}" onclick="cycleProject('${p.id}',this)">${lbl}</button>
      </div>`;
    }).join('');
    html += `<div class="divider-title"><span class="badge ${areaBadge[area]}" style="margin:0">${areaIcons[area]} ${areaLabels[area]}</span></div><div class="card-grid">${cards}</div>`;
  });
  document.getElementById('tab-projetos').innerHTML = `
    <div class="sec-title">Projetos práticos</div>
    <div class="sec-sub">Clique no status para avançar. Projetos concluídos vão para o portfolio.</div>
    ${html}`;
}

  document.getElementById('tab-motivacao').innerHTML = `
    <div class="sec-title">Anti-Desistência</div>

    <button class="emer-btn" onclick="document.getElementById('emer').classList.toggle('visible')">

    <div class="emer-panel" id="emer">
      <div class="card" style="border-color:#ef444440;margin-bottom:18px">

        <ul class="task-list">
          ${nextFS ? taskHTML({...nextFS,t:'[Fullstack] '+nextFS.t}) : '<li style="padding:10px;color:var(--ok)">Fullstack completo.</li>'}

          ${nextBB ? taskHTML({...nextBB,t:'[BB] '+nextBB.t}) : '<li style="padding:10px;color:var(--ok)">BB completo.</li>'}
        </ul>
        <div style="margin-top:12px;padding:12px;background:var(--surface2);border-radius:8px;font-size:0.85rem;color:var(--muted)">
          Se fizer essas 3 tarefas, você fez mais do que a maioria das pessoas que "quer estudar".
        </div>
      </div>
    </div>

    <div class="pomo-card">
      <div class="pomo-title">${IC.timer} Técnica Pomodoro</div>
      <div class="pomo-row"><span class="pomo-dot"></span><span><strong>25 min</strong> de estudo — celular no silencioso, sem redes sociais</span></div>
      <div class="pomo-row"><span class="pomo-dot rest"></span><span><strong>5 min</strong> de pausa — levanta, bebe água, sai da tela</span></div>
      <div class="pomo-row"><span class="pomo-dot"></span><span>Repita <strong>3 ou 4 vezes</strong></span></div>
      <div class="pomo-row"><span class="pomo-dot rest"></span><span><strong>20–30 min</strong> de pausa longa</span></div>
      <div style="margin-top:10px;font-size:0.8rem;color:var(--muted)">São ~2h de estudo real. Não precisa de mais que isso por dia.</div>
    </div>

    <div class="divider-title">Regras anti-pânico</div>
    ${[
      [IC.phone,   'Primeiro Pomodoro sempre sem celular. Sem exceção. Coloca o celular em outro cômodo.'],
      [IC.target,  'Um tópico por vez. Não abre dez abas. Escolhe uma coisa e fecha o resto.'],

      [IC.skip,    'Travou num tópico difícil? Pula para o próximo. Volta depois. Progresso importa mais que ordem.'],
      [IC.star,    'Sem motivação? Abre o site, escolhe 1 tarefa, marca. Só isso. Pode parar depois.'],
    ].map(([i,t])=>`<div class="rule-item"><span class="rule-icon" style="color:var(--muted)">${i}</span><span>${t}</span></div>`).join('')}

    <div class="divider-title">Quando você estiver assim</div>
    <div class="card">
      <div>
        ${[
          ['#a855f7','Sem energia',   'Modo Emergência acima. 1 tarefa por área. Fim.'],
          ['#06b6d4','Entediada',     'Mude a área. Estava no Fullstack? Vai pro BB. Variedade vence abandono.'],
          ['#f59e0b','Distraída',     'Troca de ambiente. Outro cômodo, fone, fecha tudo.'],

          ['#7777aa','Achando inútil','Abre a aba Projetos. Veja o que vai conseguir construir. O porquê salva o como.'],
        ].map(([c,s,d])=>`<div class="situation-row">
          <span class="situation-dot" style="background:${c}"></span>

/* ── TABS ── */
function showTab(id) {
  document.querySelectorAll('.tab-panel').forEach(el=>el.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(el=>el.classList.remove('active'));
  document.getElementById('tab-'+id).classList.add('active');
  document.querySelector(`[data-tab="${id}"]`).classList.add('active');
}

/* ── INIT ── */
function init() {
  loadState();

  const now = new Date();
  document.getElementById('date-el').textContent =
    now.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  document.getElementById('quote-el').textContent =
    QUOTES[Math.floor(Date.now()/86400000) % QUOTES.length];

  renderStreak();
  rerenderAll();          // renderHoje + renderSemana + trilhas + nav + reavaliação
  renderProjetos();
  renderMotivacao();

  document.querySelectorAll('.nav-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>showTab(btn.dataset.tab));
  });
}

init();

</script>
</body>
</html>
