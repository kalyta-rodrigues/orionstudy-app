<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<style>
:root {
  --bg: #0d0d1a;
  --surface: #13132b;
  --surface2: #1a1a38;
  --border: #2a2a55;
  --text: #e2e2f0;
  --muted: #7777aa;
  --fs: #a855f7;
  --de: #06b6d4;
  --bb: #f59e0b;
  --ok: #10b981;
  --radius: 12px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; line-height: 1.6; }

.header {
  background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 14px 24px; display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 100; flex-wrap: wrap; gap: 10px;
}
.header-left { display: flex; align-items: center; gap: 16px; }
.back-link {
  display: flex; align-items: center; gap: 6px;
  color: var(--muted); font-size: 0.82rem; text-decoration: none; transition: color 0.2s;
}
.back-link:hover { color: var(--text); }
.logo { font-size: 1.3rem; font-weight: 800; background: linear-gradient(135deg, #a855f7, #ec4899, #f59e0b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.header-sub { font-size: 0.8rem; color: var(--muted); }

.search-wrap { position: relative; }
.search-input {
  background: var(--surface2); border: 1px solid var(--border); color: var(--text);
  padding: 8px 12px 8px 36px; border-radius: 8px; font-size: 0.85rem; width: 220px;
  outline: none; transition: border-color 0.2s;
}
.search-input:focus { border-color: var(--fs); }
.search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }

.content { max-width: 1100px; margin: 0 auto; padding: 24px 20px 80px; }

.filter-bar { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; }
.filter-btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 16px; border-radius: 99px; border: 1px solid var(--border);
  background: var(--surface); color: var(--muted); font-size: 0.82rem; font-weight: 600;
  cursor: pointer; transition: all 0.2s;
}
.filter-btn:hover { border-color: var(--muted); color: var(--text); }
.filter-btn.active-all  { background: #ffffff15; border-color: var(--text); color: var(--text); }
.filter-btn.active-fs   { background: #a855f720; border-color: var(--fs); color: #c084fc; }
.filter-btn.active-de   { background: #06b6d420; border-color: var(--de); color: #22d3ee; }
.filter-btn.active-bb   { background: #f59e0b20; border-color: var(--bb); color: #fbbf24; }
.filter-btn.active-dio  { background: #10b98120; border-color: #10b981; color: #34d399; }

.stats-row { display: flex; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; }
.stat-chip {
  background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
  padding: 10px 16px; font-size: 0.8rem; color: var(--muted);
}
.stat-chip strong { display: block; font-size: 1.2rem; font-weight: 800; color: var(--text); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 14px; }
@media (max-width: 720px) { .grid { grid-template-columns: 1fr; } }

.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); overflow: hidden; transition: border-color 0.2s;
}
.card:hover { border-color: #4444aa; }

.card-head {
  padding: 16px 18px; cursor: pointer;
  display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
}
.card-head:hover { background: #ffffff04; }

.card-title-wrap { flex: 1; }
.card-badges { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
.badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 9px; border-radius: 99px; font-size: 0.7rem; font-weight: 700;
}
.badge-fs { background: #a855f71a; color: #c084fc; border: 1px solid #a855f740; }
.badge-de { background: #06b6d41a; color: #22d3ee; border: 1px solid #06b6d440; }
.badge-bb { background: #f59e0b1a; color: #fbbf24; border: 1px solid #f59e0b40; }
.badge-dio { background: #10b9811a; color: #34d399; border: 1px solid #10b98140; }

.card-name { font-size: 1rem; font-weight: 700; margin-bottom: 4px; }
.card-source-preview { font-size: 0.78rem; color: var(--muted); }
.card-source-preview a { color: #c084fc; text-decoration: none; }
.card-source-preview a:hover { text-decoration: underline; }

.chevron { color: var(--muted); flex-shrink: 0; transition: transform 0.2s; }
.card.open .chevron { transform: rotate(180deg); }

.card-body { display: none; border-top: 1px solid var(--border); }
.card.open .card-body { display: block; }

.section { padding: 14px 18px; border-bottom: 1px solid var(--border); }
.section:last-child { border-bottom: none; }
.section-label {
  font-size: 0.7rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1.5px;
  color: var(--muted); margin-bottom: 8px; display: flex; align-items: center; gap: 6px;
}
.section-label svg { flex-shrink: 0; }
.section-content { font-size: 0.855rem; line-height: 1.6; }
.section-content a { color: #c084fc; text-decoration: none; }
.section-content a:hover { text-decoration: underline; }

.resource-row { display: flex; align-items: flex-start; gap: 10px; padding: 6px 0; }
.resource-type {
  font-size: 0.68rem; font-weight: 700; padding: 2px 7px; border-radius: 4px;
  background: var(--surface2); color: var(--muted); flex-shrink: 0; margin-top: 2px;
  text-transform: uppercase; letter-spacing: 0.5px;
}

.order-list { list-style: none; counter-reset: order; }
.order-list li {
  counter-increment: order; display: flex; align-items: flex-start; gap: 10px;
  padding: 5px 0; font-size: 0.84rem;
}
.order-list li::before {
  content: counter(order);
  background: var(--surface2); color: var(--muted);
  width: 20px; height: 20px; border-radius: 99px;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.7rem; font-weight: 800; flex-shrink: 0; margin-top: 2px;
}

.project-box {
  background: var(--surface2); border-radius: 8px; padding: 12px 14px;
  font-size: 0.84rem; line-height: 1.6; border-left: 3px solid var(--fs);
}

.status-row { padding: 12px 18px; display: flex; align-items: center; gap: 10px; }
.status-label { font-size: 0.78rem; color: var(--muted); }
.status-select {
  background: var(--surface2); border: 1px solid var(--border); color: var(--text);
  padding: 5px 10px; border-radius: 6px; font-size: 0.78rem; cursor: pointer; outline: none;
}
.status-select:focus { border-color: var(--fs); }

.status-dot {
  width: 8px; height: 8px; border-radius: 99px; flex-shrink: 0;
}
.dot-none     { background: var(--border); }
.dot-studying { background: var(--de); }
.dot-review   { background: var(--bb); }
.dot-done     { background: var(--ok); }

.empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }
.empty-state svg { margin-bottom: 12px; opacity: 0.4; }

/* ═══════════ MODO CLARO — ativado por data-theme="light" no <html> ═══════════ */
:root[data-theme="light"] {
  --bg: #f4f4fa;
  --surface: #ffffff;
  --surface2: #ededf5;
  --border: #dadae8;
  --text: #1c1c30;
  --muted: #5f5f7c;
  --fs: #7c3aed;
  --de: #0e7490;
  --bb: #b45309;
  --ok: #047857;
}
:root[data-theme="light"] body { background: var(--bg); color: var(--text); }
:root[data-theme="light"] .badge-fs,
:root[data-theme="light"] .filter-btn.active-fs { color: #6d28d9; }
:root[data-theme="light"] .badge-de,
:root[data-theme="light"] .filter-btn.active-de { color: #0e7490; }
:root[data-theme="light"] .badge-bb,
:root[data-theme="light"] .filter-btn.active-bb { color: #b45309; }
:root[data-theme="light"] .badge-dio,
:root[data-theme="light"] .filter-btn.active-dio { color: #047857; }
:root[data-theme="light"] .filter-btn.active-all { background: #0000000d; border-color: var(--text); color: var(--text); }
:root[data-theme="light"] .card:hover { border-color: #a3a3d0; }
:root[data-theme="light"] .card-source-preview a,
:root[data-theme="light"] .section-content a { color: #6d28d9; }
</style>
</head>

    principal:{ type:'Formação DIO Pro', label:'Formação Fundamentos de Inteligência Artificial — DIO (assinatura Pro)', url:'https://web.dio.me/track/formacao-fundamentos-de-inteligencia-artificial' },
    meta:'10h · 8 cursos · 2 atividades · salva na Minha Lista',
    revisao:'Conversa com o bloco de IA/ML do cronograma do BB (Tecnologia da Informação).'
  },
  {
    id:'dio-nublify-ia-cloud', name:'Nublify — Primeiros passos em IA e Cloud', areas:['dio','de'], dio:true,
    principal:{ type:'Bootcamp DIO Pro', label:'Nublify - Primeiros passos em IA e Cloud — DIO (assinatura Pro)', url:'https://web.dio.me/track/nublify-primeiros-passos-em-ia-e-cloud' },
    meta:'40h · 25 cursos · 4 lives · 8 atividades · salva na Minha Lista'
  },
  {
    id:'dio-microsoft-week-ai-data', name:'Microsoft Week — AI Data Engineering', areas:['dio','de'], dio:true,
    principal:{ type:'Evento DIO Pro', label:'Microsoft Week - AI Data Engineering — DIO (assinatura Pro)', url:'https://web.dio.me/track/microsoft-week-ai-data-enginieering' },
    meta:'2h · 1 curso · 3 lives · 4 atividades · salva na Minha Lista'
  },
  {
    id:'dio-cursos-avulsos', name:'Cursos avulsos salvos na DIO', areas:['dio'], dio:true,
    principal:{ type:'Cursos DIO Pro', label:'Minha Lista na DIO — cursos individuais (assinatura Pro)', url:'https://web.dio.me' },
    meta:'9 cursos avulsos salvos, fora das formações acima',

    revisao:'Vários desses cursos também aparecem dentro das formações de SQL e Java acima — não estude em duplicidade.'

/* ── STATE ── */
let state = { status:{} };
function loadState() { try { const s = localStorage.getItem('orion_lib_v2'); if(s) state = JSON.parse(s) || {}; } catch(e){} state.status = state.status || {}; }
function saveState() { try { localStorage.setItem('orion_lib_v2', JSON.stringify(state)); } catch(e){} }
function getStatus(id) { return state.status[id] || 'none'; }

/* ── FILTER + SEARCH ── */
let activeFilter = 'all';
let searchTerm = '';

function getFiltered() {
  return LIBRARY.filter(s => {
    const matchesFilter = activeFilter === 'all' || s.areas.includes(activeFilter);
    const matchesSearch = s.name.toLowerCase().includes(searchTerm.toLowerCase());
    return matchesFilter && matchesSearch;
  });
}

/* ── BADGE HTML ── */
function areasBadges(areas) {
  const map = { fs:'badge-fs', de:'badge-de', bb:'badge-bb', dio:'badge-dio' };
  const label = { fs:'Fullstack', de:'Dados', bb:'BB', dio:'DIO Pro' };
  return areas.map(a => `<span class="badge ${map[a]}">${label[a]}</span>`).join('');
}

/* ── STATUS DOT ── */
function statusDot(st) {
  const cls = { none:'dot-none', studying:'dot-studying', review:'dot-review', done:'dot-done' };
  return `<span class="status-dot ${cls[st] || 'dot-none'}"></span>`;
}

/* ── CARD HTML ── */
function linkOrText(o) {
  return o.url
    ? `<a href="${o.url}" target="_blank" rel="noopener">${o.label}</a>`
    : o.label;
}

function cardHTML(s) {
  const st = getStatus(s.id);
  const sourceHTML = linkOrText(s.principal);

  /* Seções renderizadas só quando o campo existe — cards da DIO usam um
     subconjunto (principal + meta + ordem/conteúdo + revisão). */
  let body = `
        <div class="section">
          <div class="section-label">${I.book} Fonte principal</div>
          <div class="section-content">
            <div class="resource-row">
              <span class="resource-type">${s.principal.type}</span>
              <span>${sourceHTML}</span>
            </div>
          </div>
        </div>`;

  if (s.meta) body += `
        <div class="section">
          <div class="section-label">${I.list} O que inclui</div>
          <div class="section-content" style="color:var(--muted)">${s.meta}</div>
        </div>`;

  if (s.conteudo && s.conteudo.length) body += `
        <div class="section">
          <div class="section-label">${I.folder} Conteúdo</div>
          <div class="section-content"><ul class="order-list">${s.conteudo.map(c => `<li>${c}</li>`).join('')}</ul></div>
        </div>`;

  if (s.apoio) body += `
        <div class="section">
          <div class="section-label">${I.link} Fonte de apoio</div>
          <div class="section-content">
            <div class="resource-row">
              <span class="resource-type">${s.apoio.type}</span>
              <span>${linkOrText(s.apoio)}</span>
            </div>
          </div>
        </div>`;

  if (s.pratica) body += `
        <div class="section">
          <div class="section-label">${I.pen} Prática</div>
          <div class="section-content">${linkOrText(s.pratica)}</div>
        </div>`;

  if (s.simulado) body += `
        <div class="section">
          <div class="section-label">${I.target} Simulado / Exercício</div>
          <div class="section-content">${linkOrText(s.simulado)}</div>
        </div>`;

  if (s.ordem && s.ordem.length) body += `
        <div class="section">
          <div class="section-label">${I.list} Ordem de estudo</div>
          <div class="section-content">
            <ol class="order-list">${s.ordem.map(o => `<li>${o}</li>`).join('')}</ol>
          </div>
        </div>`;

  if (s.projeto) body += `
        <div class="section">
          <div class="section-label">${I.folder} Projeto recomendado</div>
          <div class="section-content">
            <div class="project-box">${s.projeto}</div>
          </div>
        </div>`;

  if (s.revisao) body += `
        <div class="section">
          <div class="section-label">${I.eye} Revisão rápida</div>
          <div class="section-content" style="color:var(--muted)">${s.revisao}</div>
        </div>`;

  return `
    <div class="card" id="card-${s.id}">
      <div class="card-head" onclick="toggleCard('${s.id}')">
        <div class="card-title-wrap">
          <div class="card-badges">${areasBadges(s.areas)}</div>
          <div class="card-name">${s.name}</div>
          <div class="card-source-preview">Principal: ${sourceHTML}</div>
        </div>
        <span class="chevron">${I.down}</span>
      </div>

      <div class="card-body">
        ${body}

        <div class="status-row">
          ${statusDot(st)}
          <span class="status-label">Status:</span>
          <select class="status-select" onchange="updateStatus('${s.id}', this.value)">
            <option value="none"     ${st==='none'     ?'selected':''}>Nao iniciado</option>
            <option value="studying" ${st==='studying' ?'selected':''}>Estudando</option>
            <option value="review"   ${st==='review'   ?'selected':''}>Em revisao</option>
            <option value="done"     ${st==='done'     ?'selected':''}>Concluido</option>
          </select>
        </div>
      </div>
    </div>`;
}

/* ── STATS ── */
function renderStats(items) {
  const total = items.length;
  const studying = items.filter(s => getStatus(s.id) === 'studying').length;
  const done = items.filter(s => getStatus(s.id) === 'done').length;
  const none = items.filter(s => getStatus(s.id) === 'none').length;

  document.getElementById('stats-row').innerHTML = `
    <div class="stat-chip"><strong>${total}</strong>matérias</div>
    <div class="stat-chip"><strong style="color:var(--de)">${studying}</strong>estudando</div>
    <div class="stat-chip"><strong style="color:var(--ok)">${done}</strong>concluídas</div>
    <div class="stat-chip"><strong style="color:var(--muted)">${none}</strong>não iniciadas</div>
  `;
}

/* ── RENDER GRID ── */
function render() {
  const items = getFiltered();
  renderStats(items);

  if(items.length === 0) {
    document.getElementById('grid').innerHTML = `
      <div class="empty-state" style="grid-column:1/-1">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <div>Nenhuma matéria encontrada.</div>
      </div>`;
    return;
  }

  document.getElementById('grid').innerHTML = items.map(s => cardHTML(s)).join('');
}

/* ── TOGGLE CARD ── */
function toggleCard(id) {
  document.getElementById('card-'+id)?.classList.toggle('open');
}

/* ── UPDATE STATUS ── */
function updateStatus(id, val) {
  state.status[id] = val;
  saveState();
  const card = document.getElementById('card-'+id);
  if(card) {
    const dot = card.querySelector('.status-dot');
    const cls = { none:'dot-none', studying:'dot-studying', review:'dot-review', done:'dot-done' };
    dot.className = 'status-dot ' + (cls[val] || 'dot-none');
  }
  renderStats(getFiltered());
}

/* ── FILTER BUTTONS ── */
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    activeFilter = btn.dataset.filter;
    document.querySelectorAll('.filter-btn').forEach(b => {
      b.classList.remove('active-all','active-fs','active-de','active-bb','active-dio');
    });
    const cls = activeFilter === 'all' ? 'active-all' : 'active-'+activeFilter;
    btn.classList.add(cls);
    render();
  });
});

/* ── SEARCH ── */
document.getElementById('search').addEventListener('input', e => {
  searchTerm = e.target.value;
  render();
});

/* ── INIT ── */
loadState();
render();

</script>
</body>
</html>
